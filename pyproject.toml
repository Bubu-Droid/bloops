[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.26" ]

[project]
name = "bloops"
description = "An AoPS-like BBCode to HTML transpiler, with live-preview and support for Asymptote geometry diagrams."
readme = "README.md"
keywords = [
  "aops",
  "asymptote",
  "bbcode",
  "converter",
  "diagrams",
  "geometry",
  "html",
  "latex",
  "live-preview",
  "markup",
  "math",
  "tex",
  "transpiler"
]
license = "MIT"
license-files = [ "LICEN[CS]E*" ]
authors = [ { name = "Bubu-Droid", email = "bubu@bubudroid.me" } ]
requires-python = ">=3.10"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dynamic = [ "version" ]
dependencies = [ "livereload>=2.7.1", "watchdog>=6" ]
urls.Homepage = "https://github.com/Bubu-Droid/bloops"
urls.Issues = "https://github.com/Bubu-Droid/bloops/issues"
scripts.bloops = "bloops.__main__"

[dependency-groups]
dev = [ "pytest>=9.1.1" ]

[tool.hatch]
version.path = "src/bloops/__about__.py"

[tool.ruff]
line-length = 80
lint.extend-select = [ "ANN" ]
