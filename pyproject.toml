[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.26" ]

[project]
name = "bloops"
description = "An AoPS-like BBCode to HTML transpiler, with live-preview and support for Asymptote geometry diagrams."
readme = "README.md"
keywords = [
  "aops",
  "asymptote",
  "bbcode",
  "converter",
  "diagrams",
  "geometry",
  "html",
  "latex",
  "live-preview",
  "markup",
  "math",
  "tex",
  "transpiler"
]
license = "MIT"
license-files = [ "LICEN[CS]E*" ]
authors = [ { name = "Bubu-Droid", email = "bubu@bubudroid.me" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Text Processing :: Markup",
  "Topic :: Text Processing :: Markup :: HTML",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "livereload>=2.7.1",
  "watchdog>=6",
]
urls.Documentation = "https://github.com/Bubu-Droid/bloops/blob/main/docs/api.md"
urls.Issues = "https://github.com/Bubu-Droid/bloops/issues"
urls.Repository = "https://github.com/Bubu-Droid/bloops"
scripts.bloops = "bloops.cli:main"

[dependency-groups]
dev = [
  "prek>=0.5.3",
  "pytest>=9.1.1",
]

[tool.hatch]
version.path = "src/bloops/__about__.py"
build.targets.wheel.packages = [ "src/bloops" ]
build.targets.sdist.include = [ "/src", "/tests", "/docs", "/example" ]

[tool.ruff]
line-length = 80
lint.extend-select = [ "ANN", "D", "DOC" ]
lint.per-file-ignores.".github/**" = [ "D", "DOC" ]
lint.per-file-ignores."tests/**" = [ "D", "DOC" ]
lint.unfixable = [ "F401" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
executionEnvironments = [
  { root = "tests", reportPrivateUsage = false },
]
