name: "rebuild example html"
on:
  push:
    paths: "example/content.bbcode"
  workflow_dispatch:
permissions: {}
jobs:
  update-api-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "set up python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: "install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: "install dependencies"
        run: uv sync
      - name: "generate html for bbcode example"
        run: python .github/scripts/update-example.py
      - name: "format html using prettier"
        run: uv run prek run prettier --all-files
        continue-on-error: true
      - name: "create pull request"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          delete-branch: true
          commit-message: "docs(example): rebuild index.html for new content.bbcode"
          title: "docs(example): update index.html to conform with updated content.bbcode"
          body: >
            "New index.html has been generated using
            [update-example.py](.github/scripts/update-example.py)."
