name: "Update API Docs"
on: [workflow_dispatch]
permissions: {}
jobs:
  update-api-docs:
    name: "Run update-pi-docs.py and create PR"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: "Set up Python"
        run: uv python install
      - name: "Generate and write API docs"
        run: uv run .github/scripts/update-api-docs.py
      - name: "Create pull request"
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "docs(api): rebuild new docs and write to API.md"
          title: "docs(api): rebuild and update docs"
          body: >
            New API.md has been generated using
            [update-api-docs.py](.github/scripts/update-api-docs.py).
